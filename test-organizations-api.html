<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>MOSHAVER Organizations API Test</title>
</head>
<body>
  <button id="test">تست Organizations</button>
  <pre id="result">آماده تست...</pre>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>

  <script>
    document.getElementById("test").addEventListener("click", async () => {
      const result = document.getElementById("result");

      result.textContent = "در حال تست...";

      try {
        const response = await window.MOSHAVER_API.request({
          action: "organizationsHealthCheck"
        });

        result.textContent = JSON.stringify(response, null, 2);

        console.log("ORGANIZATIONS HEALTH:", response);

      } catch (error) {
        console.error(error);
        result.textContent = "ERROR:\n" + error.message;
      }
    });
  </script>
</body>
</html>
