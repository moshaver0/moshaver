<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیر | مشاور</title>
<script>
/* Protect manager panel and enforce the same fixed 8-hour session lifetime. */
(function () {
  try {
    var token = localStorage.getItem("moshaver_access_token") ||
      sessionStorage.getItem("moshaver-access-token");
    var session = JSON.parse(localStorage.getItem("moshaver_session") || "null");
    var startedAt = Number(session && session.savedAt);
    var ttl = 8 * 60 * 60 * 1000;

    if (!token) {
      var next = location.pathname.replace(/^\\/m?/, "");
      window.location.replace("../login.html?next=" + encodeURIComponent(next));
      return;
    }

    if (!Number.isFinite(startedAt) || startedAt <= 0) {
      startedAt = Date.now();
      session = Object.assign({}, session || {}, { loggedIn: true, savedAt: startedAt, expiresAt: startedAt + ttl });
      localStorage.setItem("moshaver_session", JSON.stringify(session));
    }

    if (Date.now() - startedAt >= ttl || (Number(session.expiresAt) > 0 && Date.now() >= Number(session.expiresAt))) {
      ["moshaver_access_token", "moshaver_user", "moshaver_session"].forEach(function (key) { localStorage.removeItem(key); });
      sessionStorage.removeItem("moshaver-access-token");
      sessionStorage.removeItem("moshaver-user");
      window.location.replace("../login.html?reason=session-expired");
    }
  } catch (e) {
    window.location.replace("../login.html");
  }
})();
</script>
</head>
<body></body>
</html>
