<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیر | مشاور</title>
<script>
/* MOSHAVER: protect manager panel from direct unauthenticated access */
(function () {
  try {
    var token = localStorage.getItem("moshaver_access_token") ||
      sessionStorage.getItem("moshaver-access-token");
    if (!token) {
      var next = location.pathname.replace(/^\\/m?/,"");
      window.location.replace("../login.html?next=" + encodeURIComponent(next));
    }
  } catch (e) {
    window.location.replace("../login.html");
  }
})();
</script>
</head>
<body></body>
</html>
